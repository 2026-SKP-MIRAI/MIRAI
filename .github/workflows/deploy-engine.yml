name: Deploy engine to EC2

on:
  push:
    branches: [main, refactor/000263-engine-ci-services-ci]
    paths:
      - 'engine/**'
      - '!engine/.ai.md'
      - '!engine/README.md'
  workflow_dispatch:  # GitHub Actions 탭에서 수동 트리거 가능
    inputs:
      skip_build:
        description: '빌드 생략하고 재시작만 (서버 재시작용, pull 생략)'
        type: boolean
        default: false

jobs:
  test-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -e "engine[dev]"
      - name: Run unit tests
        run: pytest engine/tests/unit -v

  build-and-push-engine:
    needs: [test-engine]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'push' || inputs.skip_build == false }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login
      - name: Build and push engine
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build \
            -t $ECR_REGISTRY/mirai-engine:latest \
            -t $ECR_REGISTRY/mirai-engine:${{ github.sha }} \
            -f engine/Dockerfile \
            engine
          docker push $ECR_REGISTRY/mirai-engine --all-tags

  deploy:
    needs: [test-engine, build-and-push-engine]
    if: ${{ always() && needs.test-engine.result == 'success' && (needs.build-and-push-engine.result == 'success' || needs.build-and-push-engine.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          SKIP_PULL: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_build == true && 'true' || 'false' }}
        with:
          host: ${{ secrets.ENGINE_EC2_HOST }}
          username: ${{ secrets.ENGINE_EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_REGION,ECR_REGISTRY,SKIP_PULL
          script: |
            set -euo pipefail

            # ECR 로그인
            aws ecr get-login-password --region $AWS_REGION | \
              docker login --username AWS --password-stdin $ECR_REGISTRY

            # env 파일 존재 확인 — 없으면 배포 중단
            if [ ! -f ~/.env.engine ]; then
              echo "ERROR: ~/.env.engine not found on host" >&2
              exit 1
            fi

            # 현재 이미지에 rollback 태그 부여 (pull 후 latest 재지정돼도 이미지 보존)
            PREV_IMAGE=$(docker inspect mirai-engine --format '{{.Config.Image}}' 2>/dev/null || echo "")
            if [ -z "$PREV_IMAGE" ]; then
              echo "Warning: 기존 컨테이너 없음 (최초 배포 또는 수동 삭제됨)" >&2
            else
              docker tag "$PREV_IMAGE" mirai-engine:rollback 2>/dev/null || true
            fi

            # 기존 컨테이너 정리
            docker stop mirai-engine 2>/dev/null || true
            docker rm mirai-engine 2>/dev/null || true

            # 이미지 pull (skip_build=true 시 생략 — 현재 이미지로 재시작)
            if [ "$SKIP_PULL" = "true" ]; then
              if ! docker image inspect $ECR_REGISTRY/mirai-engine:latest > /dev/null 2>&1; then
                echo "ERROR: skip_build=true이지만 로컬에 $ECR_REGISTRY/mirai-engine:latest 이미지 없음 — pull 없이 시작 불가" >&2
                exit 1
              fi
            else
              docker pull $ECR_REGISTRY/mirai-engine:latest || { echo "ERROR: docker pull failed" >&2; exit 1; }
            fi

            # engine 시작
            docker run -d --name mirai-engine \
              --restart unless-stopped \
              --env-file ~/.env.engine \
              -p 8000:8000 \
              $ECR_REGISTRY/mirai-engine:latest

            # 헬스체크 (최대 30초, 5초 간격)
            HEALTHY=false
            for i in $(seq 1 6); do
              sleep 5
              if curl -sf http://localhost:8000/ > /dev/null; then
                HEALTHY=true
                break
              fi
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "ERROR: health check failed after 30s" >&2
              docker stop mirai-engine 2>/dev/null || true
              docker rm mirai-engine 2>/dev/null || true
              if docker image inspect mirai-engine:rollback > /dev/null 2>&1; then
                echo "롤백: 이전 이미지로 복구 중..." >&2
                docker run -d --name mirai-engine \
                  --restart unless-stopped \
                  --env-file ~/.env.engine \
                  -p 8000:8000 \
                  mirai-engine:rollback
              else
                echo "Warning: 롤백할 이미지 없음 — 컨테이너 없는 상태로 종료" >&2
              fi
              exit 1
            fi

            # 성공 시 rollback 태그 제거 + 미사용 이미지 정리
            docker rmi mirai-engine:rollback 2>/dev/null || true
            docker image prune -f
