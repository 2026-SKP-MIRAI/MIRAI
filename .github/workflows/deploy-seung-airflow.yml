name: Deploy seung Airflow to EC2

on:
  push:
    branches: [main]
    paths:
      - 'services/seung/airflow/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SEUNG_AIRFLOW_EC2_HOST }}
          username: ${{ secrets.SEUNG_AIRFLOW_EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # env 파일 존재 확인 — 없으면 배포 중단
            if [ ! -f ~/.env.seung-airflow ]; then
              echo "ERROR: ~/.env.seung-airflow not found on host" >&2
              exit 1
            fi

            # 최신 코드 동기화 — reset --hard로 서버 git 상태에 무관하게 강제 동기화
            cd ~/MIRAI
            git fetch origin main
            git reset --hard FETCH_HEAD

            # airflow 재시작 (down 없이 up --build로 무중단 교체)
            cd services/seung/airflow
            docker compose up -d --build
            echo "seung Airflow 배포 완료"
