services:
  airflow:
    build: .
    restart: always
    env_file:
      - ~/.env.seung-airflow   # EC2 호스트에 위치 — 자격증명 파일
    ports:
      - "127.0.0.1:8080:8080"  # 로컬호스트만 바인딩 — 외부 접근은 SSH 터널 사용
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_SECRET_KEY:?AIRFLOW_SECRET_KEY 환경변수를 설정하세요}"
      # Airflow Variables — AIRFLOW_VAR_* 패턴으로 자동 등록
      # AWS 자격증명은 EC2 IAM Instance Role로 자동 주입 — 여기에 명시하지 않음
      AIRFLOW_VAR_SEUNG_S3_ANALYTICS_BUCKET: "${SEUNG_S3_ANALYTICS_BUCKET}"
      # seung_resume_embed_dag 필요 Variables (#293)
      AIRFLOW_VAR_RAG_DATABASE_URL: "${RAG_DATABASE_URL}"
      AIRFLOW_VAR_SEUNG_DATABASE_URL: "${SEUNG_DATABASE_URL}"
      # AIRFLOW_VAR_ENGINE_BASE_URL: "${ENGINE_BASE_URL}"  # 기본값 http://localhost:8000 — 변경 필요 시 활성화
      # Airflow Connections — AIRFLOW_CONN_* 패턴으로 자동 등록
      AIRFLOW_CONN_SEUNG_DB_READONLY: "${SEUNG_DB_READONLY_CONN}"
    volumes:
      - ./dags:/opt/airflow/dags   # 로컬 DAG 수정 즉시 반영
      - airflow_db:/home/airflow   # SQLite + logs 영속화
    extra_hosts:
      - "host.docker.internal:host-gateway"  # 컨테이너→호스트 localhost 접근
    command: standalone

volumes:
  airflow_db:
